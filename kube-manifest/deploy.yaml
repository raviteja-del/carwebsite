apiVersion: apps/v1
kind: Deployment
metadata:
  name: carwebsite-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: carwebsite
  template:
    metadata:
      labels:
        app: carwebsite
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: website-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: website-volume
        configMap:
          name: website-config
